<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1536 864"
     width="1536"
     height="864">

  <defs>
    <!-- Gold gradient -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff36a"/>
      <stop offset="0.18" stop-color="#ffd52a"/>
      <stop offset="0.5" stop-color="#f5b400"/>
      <stop offset="0.82" stop-color="#d99100"/>
      <stop offset="1" stop-color="#ffc928"/>
    </linearGradient>

    <!-- Border highlight -->
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#ffd21a"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="0.75" stop-color="#e8a000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BLACK BACKGROUND -->
  <rect width="1536" height="864" fill="#000"/>

  <!-- OUTER FRAME -->
  <rect x="48"
        y="28"
        width="1440"
        height="808"
        rx="45"
        fill="#050505"
        stroke="url(#border)"
        stroke-width="12"
        filter="url(#glow)"/>

  <!-- INNER FRAME -->
  <rect x="61"
        y="42"
        width="1414"
        height="780"
        rx="34"
        fill="none"
        stroke="#171717"
        stroke-width="4"/>

  <!-- 4K -->
  <text x="768"
        y="470"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="455"
        font-weight="900"
        letter-spacing="8"
        fill="url(#gold)"
        stroke="#a96d00"
        stroke-width="4"
        paint-order="stroke">
    4K
  </text>

  <!-- GOLD LOWER PANEL -->
  <rect x="69"
        y="534"
        width="1398"
        height="282"
        fill="url(#gold)"/>

  <!-- PANEL TOP LINE -->
  <rect x="69"
        y="528"
        width="1398"
        height="8"
        fill="#fff08a"/>

  <!-- ULTRA -->
  <text x="605"
        y="735"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="150"
        font-weight="900"
        letter-spacing="2"
        fill="#050505">
    ULTRA
  </text>

  <!-- HD BLACK BOX -->
  <rect x="950"
        y="562"
        width="340"
        height="205"
        fill="#030303"
        stroke="#d99a00"
        stroke-width="5"/>

  <!-- HD -->
  <text x="1120"
        y="720"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="145"
        font-weight="900"
        fill="url(#gold)">
    HD
  </text>

  <!-- Subtle inner highlight -->
  <rect x="76"
        y="544"
        width="1384"
        height="262"
        fill="none"
        stroke="#ffdf45"
        stroke-opacity=".25"
        stroke-width="2"/>

</svg>

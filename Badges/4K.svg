<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1536 864">

  <defs>

    <!-- GOLD -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7a0"/>
      <stop offset="0.12" stop-color="#ffe64a"/>
      <stop offset="0.32" stop-color="#ffc414"/>
      <stop offset="0.55" stop-color="#f2a900"/>
      <stop offset="0.78" stop-color="#ffc51c"/>
      <stop offset="1" stop-color="#d88a00"/>
    </linearGradient>

    <!-- GOLD BRIGHT -->
    <linearGradient id="goldBright" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d99400"/>
      <stop offset="0.18" stop-color="#fff59a"/>
      <stop offset="0.38" stop-color="#ffd82b"/>
      <stop offset="0.58" stop-color="#fff8a0"/>
      <stop offset="0.78" stop-color="#f2ad00"/>
      <stop offset="1" stop-color="#fff08a"/>
    </linearGradient>

    <!-- GOLD PANEL -->
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d99300"/>
      <stop offset="0.12" stop-color="#f9b900"/>
      <stop offset="0.32" stop-color="#ffd53b"/>
      <stop offset="0.5" stop-color="#f5b300"/>
      <stop offset="0.72" stop-color="#ffd02b"/>
      <stop offset="0.9" stop-color="#eaa000"/>
      <stop offset="1" stop-color="#c98200"/>
    </linearGradient>

    <!-- BLACK -->
    <linearGradient id="black" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#000000"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>

    <!-- GLOW -->
    <filter id="glow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- TEXT SHADOW -->
    <filter id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">
      <feGaussianBlur in="SourceAlpha"
                      stdDeviation="5"
                      result="blur"/>
      <feOffset dx="0" dy="6" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear"
                 slope="0.65"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ================================= -->
  <!-- OUTER BLACK BACKGROUND -->
  <!-- ================================= -->

  <rect width="1536"
        height="864"
        fill="#000"/>


  <!-- ================================= -->
  <!-- OUTER GOLD FRAME -->
  <!-- ================================= -->

  <rect x="38"
        y="22"
        width="1460"
        height="820"
        rx="52"
        fill="none"
        stroke="#8c5b00"
        stroke-width="18"/>

  <rect x="43"
        y="25"
        width="1450"
        height="814"
        rx="49"
        fill="none"
        stroke="url(#goldBright)"
        stroke-width="10"
        filter="url(#glow)"/>

  <!-- WHITE HIGHLIGHT -->
  <rect x="52"
        y="34"
        width="1432"
        height="796"
        rx="42"
        fill="none"
        stroke="#fffbd5"
        stroke-width="3"/>


  <!-- ================================= -->
  <!-- INNER BLACK AREA -->
  <!-- ================================= -->

  <rect x="67"
        y="52"
        width="1402"
        height="768"
        rx="32"
        fill="url(#black)"
        stroke="#171717"
        stroke-width="5"/>


  <!-- ================================= -->
  <!-- 4K -->
  <!-- ================================= -->

  <text x="768"
        y="475"
        text-anchor="middle"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="470"
        font-weight="900"
        letter-spacing="-18"
        fill="url(#gold)"
        stroke="#9d6500"
        stroke-width="7"
        paint-order="stroke"
        filter="url(#shadow)">4K</text>


  <!-- ================================= -->
  <!-- SEPARATOR -->
  <!-- ================================= -->

  <rect x="69"
        y="531"
        width="1398"
        height="8"
        fill="#fff08a"/>

  <rect x="69"
        y="539"
        width="1398"
        height="4"
        fill="#d68c00"/>


  <!-- ================================= -->
  <!-- GOLD LOWER PANEL -->
  <!-- ================================= -->

  <rect x="69"
        y="543"
        width="1398"
        height="267"
        fill="url(#panel)"/>


  <!-- PANEL HIGHLIGHT -->
  <rect x="69"
        y="543"
        width="1398"
        height="8"
        fill="#fff3a0"/>


  <!-- ================================= -->
  <!-- ULTRA -->
  <!-- ================================= -->

  <text x="600"
        y="735"
        text-anchor="middle"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="151"
        font-weight="900"
        letter-spacing="-3"
        fill="#030303"
        stroke="#e7a800"
        stroke-width="3"
        paint-order="stroke">ULTRA</text>


  <!-- ================================= -->
  <!-- HD BLACK BOX -->
  <!-- ================================= -->

  <rect x="947"
        y="565"
        width="344"
        height="205"
        rx="5"
        fill="#030303"
        stroke="#c98700"
        stroke-width="6"/>

  <rect x="953"
        y="571"
        width="332"
        height="193"
        rx="3"
        fill="none"
        stroke="#fff08a"
        stroke-width="3"/>


  <!-- ================================= -->
  <!-- HD -->
  <!-- ================================= -->

  <text x="1120"
        y="719"
        text-anchor="middle"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="145"
        font-weight="900"
        letter-spacing="-4"
        fill="url(#gold)"
        stroke="#e1a000"
        stroke-width="3"
        paint-order="stroke">HD</text>


  <!-- ================================= -->
  <!-- LOWER FRAME -->
  <!-- ================================= -->

  <rect x="69"
        y="810"
        width="1398"
        height="6"
        fill="#8c5b00"/>

  <rect x="75"
        y="807"
        width="1386"
        height="3"
        fill="#fff08a"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1536 864"
     width="1536" height="864">

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff35a"/>
      <stop offset=".35" stop-color="#ffd21a"/>
      <stop offset=".7" stop-color="#f5b400"/>
      <stop offset="1" stop-color="#e89a00"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- HDR -->
  <text x="768"
        y="565"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="510"
        font-weight="700"
        letter-spacing="5"
        fill="url(#gold)"
        stroke="#d99a00"
        stroke-width="3"
        paint-order="stroke"
        filter="url(#glow)">HDR</text>

  <!-- HIGH DYNAMIC RANGE -->
  <text x="768"
        y="738"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="91"
        font-weight="400"
        letter-spacing="2"
        fill="#ffffff">HIGH DYNAMIC RANGE</text>

</svg>

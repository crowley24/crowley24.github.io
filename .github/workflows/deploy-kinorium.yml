
name: Deploy Kinorium OST Worker

on:
  push:
    branches:
      - main
    paths:
      - 'kinorium_worker.js'
      - 'wrangler.kinorium.jsonc'
      - '.github/workflows/deploy-kinorium.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Kinorium OST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Check configuration
        run: |
          echo "Checking required files..."
          test -f kinorium_worker.js
          test -f wrangler.kinorium.jsonc
          echo "Files found successfully."

      - name: Deploy Kinorium to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config wrangler.kinorium.jsonc --log-level debug
